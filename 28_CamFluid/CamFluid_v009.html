<script>
/* ═══════════════════════════════════════════════════════════════════════
   № 28 — CamFluid · v009

   v009: FLIP defaults to the camera underlay on (0.35) and all four
   borders open. Gas keeps the closed box and no underlay.

   v008:
   open borders no longer reflect FLIP particles. v006 still ran the
   wall bounce (clamp to half a cell, reverse the normal velocity) on every
   edge, open or not, so particles in the last half cell before an open
   edge were thrown back inwards with their velocity flipped. The bounce
   now runs only on closed edges; at an open edge the particle keeps its
   velocity, crosses the edge and dies there.

   v007:
   (FLIP): particles can be dead (colour alpha = 0: not splatted, not
   drawn). Two checkboxes decide how dead particles come back:
   - Fill container: reborn anywhere at random, so the box stays full
     (the v006 behaviour). Off: the box starts empty.
   - Emit from motion: each dead particle tries 4 random spots per step and
     is reborn at one where there is motion, with probability
     emit rate · motion · dt; it starts with the grid velocity there and the
     camera colour. With both on, motion comes first and random fill is the
     fallback. With neither, dead particles stay dead (R restarts).
   A particle dies at the end of its life (respawn) or through an open edge.
   Toggling either checkbox restarts the particles.

   v006:
   each screen edge can be opened (Borders: left / right / bottom /
   top, per solver). An open edge is an outflow boundary: pressure 0
   outside (Dirichlet) instead of a mirrored wall (Neumann), the normal
   velocity is not zeroed there, dye traced back from beyond it comes in
   empty, and FLIP particles that leave through it respawn inside.
   uOpen = (left, right, bottom, top), 1 = open.

   v005:
   v005: S saves the frame as HEIC, without UI: the graded image is read
   back right after the post pass, before the motion vectors, at the
   canvas resolution (render scale). Encoding: icodec 0.6.0 (MIT;
   libheif + x265, GPL) from jsDelivr, in a module worker. x265 runs
   threads on shared memory, so the page must be cross-origin isolated:
   coi-sw.js (a service worker next to this file) adds COOP / COEP
   headers and the page reloads once. That needs http(s) — GitHub Pages
   or localhost; on file:// or without isolation, S saves a PNG instead.
   The encoder's pthread workers load the encoder script itself; it is
   fetched and run from a blob, with its self-URL patched to that blob.

   v005 dissolve (soft opacity instead of hard-edged blobs):
   - Gas dye is now PREMULTIPLIED (rgb · density): injection adds camera
     colour times the amount, so empty cells no longer snap to the camera
     colour and the edges keep a colour gradient. Softness diffuses the
     dye a little each step (edges blur as it dissolves); Breakup varies
     the fade rate with drifting value noise, so it dissolves in wisps
     instead of all at once. The display maps density to opacity through
     an edge / curve ramp and composites the dye OVER the field layer
     (no more max(density, field) step).
   - FLIP particles have a lifetime: pos.z = age, pos.w = a random life
     factor (0.5–1.5 × 1 / respawn). They fade in over the first part of
     their life and out over the last, then respawn. Respawn 0 = immortal.
     Soft points add a radial opacity gradient to each point.

   v004: your own presets, per solver. Save the current solver's whole
   set under a name, load, overwrite, delete; export all presets as JSON
   and import them again (merged by name). Stored in localStorage under
   camfluid.presets as { gas: { name: settings }, flip: { ... } }.

   v003:
   - Settings are kept per solver (Gas and FLIP each have their own
     resolution, forces, colour and view); switching solver switches the
     whole set.
   - GPU presets per solver: Low GPU / Default / High GPU. They set only
     the cost keys (grid, dye detail, vector grid, render scale, pressure
     iterations, particles, point size), never forces or colour.
   - Colour: the scene renders linear into a half-float target and a
     post pass grades it: exposure (EV), temperature, saturation, hue
     shift, tone map (clamp / Reinhard / ACES), contrast, gamma.
   - Velocity gradients: a gradient map (14 palettes plus Direction, hue
     from the flow angle) over the speed |v| / speed range, blended with
     the camera colour (Gradient mix). Gas samples the grid velocity per
     pixel (Field shows it outside the dye too); FLIP colours each
     particle by its own velocity.

   v002: settings in view; particles up to 2.1M; resolution and force
   strength controls.

   The webcam's motion vectors drive a 2D fluid; the colour comes from the
   webcam's rgb. Two solvers on one flat grid (closed box, square cells,
   the grid matches the screen's aspect):

   - Gas (after the Orogeny atmosphere, №14 v007/v010, flattened): curl,
     semi-Lagrangian MIDPOINT advection of velocity and dye, forcing
     (motion vectors, vorticity confinement, damping), divergence,
     warm-started Jacobi, projection. The dye carries rgb PAINT plus
     density (v010: colour is advected, not a value mapped afterwards).
   - FLIP (after the Gas Giant, №02, flattened): particles in float
     textures; P2G as additive bilinear splats (4 corners per particle),
     normalise, forcing, keep the pre-projection grid, the same pressure
     solve, G2P with the FLIP / PIC blend (0.97), RK2 advection, wall
     bounce, random respawn. Particle colour is sampled from the webcam
     at birth and drifts towards the webcam colour under it (Live colour).

   Motion vectors: Lucas-Kanade optical flow on the GPU. Luminance of the
   mirrored camera, Ix / Iy / It from the mean and difference of two
   frames, the structure-tensor products blurred (separable Gaussian),
   then the 2x2 solve with a small ridge term, a noise gate and temporal
   smoothing. Flow (pixels per camera frame) becomes grid cells per second.

   Forcing: v += (strength · flow - v) · clamp(push · |flow| · 6 dt).
   ═══════════════════════════════════════════════════════════════════════ */
'use strict';
const $ = (id) => document.getElementById(id);
const canvas = $('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
if (!gl) document.body.innerHTML = '<p style="padding:40px">WebGL2 is needed.</p>';
if (!gl.getExtension('EXT_color_buffer_float')) console.warn('EXT_color_buffer_float missing');

/* ── gradients (stops, dark → bright); the last entry is Direction, hue from the flow angle ── */
const GRADS = [
  ['FUI cyan', '000000 04202c 0e5a78 3fb8e0 7fe0ff e8fbff'],
  ['Inferno', '000004 420a68 932667 dd513a fca50a fcffa4'],
  ['Magma', '000004 3b0f70 8c2981 de4968 fe9f6d fcfdbf'],
  ['Plasma', '0d0887 6a00a8 b12a90 e16462 fca636 f0f921'],
  ['Viridis', '440154 414487 2a788e 22a884 7ad151 fde725'],
  ['Turbo', '30123b 4662d7 36aaf9 1ae4b6 72fe5e c8ef34 faba39 f66b19 ca2a04 7a0403'],
  ['Fire', '000000 3a0500 a01e00 f05a00 ffb400 fff5c0'],
  ['Ice', '000000 0b1f3a 1f5f9e 4fb3e8 bdf0ff ffffff'],
  ['Neon', '05000f 3c00a0 ff00c8 00f0ff ffffff'],
  ['Toxic', '000000 0a2a10 1a8a30 a0ff40 f8ffd0'],
  ['Sunset', '0b0221 3d1a6e b23a74 f2665b fbb45c fff1c1'],
  ['Ocean', '000814 00335c 0a6e8a 38b2ac a7f3d0'],
  ['Copper', '000000 3a1a0a 8a4a20 d08850 ffd0a0'],
  ['Mono', '000000 ffffff'],
  ['Direction', null],
];
const DIR = GRADS.length - 1;
const stops = (g) => g[1].split(' ').map((h) => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]);
function gradAt(g, t) {   // 0..1 → [r,g,b] 0..255
  if (!g[1]) { const c = hsv(t * 360, 1, 1); return c; }
  const s = stops(g), x = t * (s.length - 1), i = Math.min(s.length - 2, Math.floor(x)), f = x - i;
  return s[i].map((v, k) => v + (s[i + 1][k] - v) * f);
}
function hsv(h, s, v) { const f = (n) => { const k = (n + h / 60) % 6; return 255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))); }; return [f(5), f(3), f(1)]; }

/* ── settings: one set per solver ── */
const COLOR_DEF = { openL: false, openR: false, openB: false, openT: false, grad: 0, gradMix: 0, vmax: 60, field: 0, exposure: 0, temp: 0, saturation: 1, hue: 0, tone: 0, contrast: 1, gamma: 1, camA: 0, vectors: true };
const DEF = {
  gas: { res: 144, dyeK: 2, flowRes: 96, scale: 1, iters: 30, strength: 1, push: 1, swirl: 18, damp: 0.25,
    gate: 0.25, flowSmooth: 0.55, flowGain: 1, inject: 2.5, fade: 0.35, ambient: 0, soft: 0.3, breakup: 0.5, breakScale: 6, edge: 0.6, curve: 1.4, ...COLOR_DEF },
  flip: { res: 128, flowRes: 96, scale: 1, iters: 30, strength: 1, push: 1.2, swirl: 10, damp: 0.15,
    gate: 0.25, flowSmooth: 0.55, flowGain: 1, count: 256, fill: true, emit: false, emitRate: 2, flip: 0.97, respawn: 0.15, live: 0.6, pt: 1.6, add: false, palpha: 0.85, fadeIn: 0.15, fadeOut: 0.4, curve: 1, softPt: 0.5, ...COLOR_DEF, camA: 0.35, openL: true, openR: true, openB: true, openT: true },
};
const PRESETS = {
  gas: {
    low:  { res: 96,  dyeK: 1, flowRes: 64,  scale: 0.5, iters: 16 },
    high: { res: 288, dyeK: 3, flowRes: 160, scale: 1,   iters: 60 },
  },
  flip: {
    low:  { res: 96,  flowRes: 64,  scale: 0.5, iters: 16, count: 256,  pt: 2.0 },
    high: { res: 256, flowRes: 160, scale: 1,   iters: 50, count: 1024, pt: 1.2 },
  },
};
const ST = { mode: 'gas', gas: { ...DEF.gas }, flip: { ...DEF.flip } };
try {
  const s = JSON.parse(localStorage.getItem('camfluid.v009') || '{}');
  if (s.mode === 'flip') ST.mode = 'flip';
  for (const m of ['gas', 'flip']) if (s[m]) Object.assign(ST[m], s[m]);
} catch (e) { /* storage off */ }
let P = ST[ST.mode];
const save = () => { try { localStorage.setItem('camfluid.v009', JSON.stringify(ST)); } catch (e) { /* storage off */ } };
// user presets
const UP = { gas: {}, flip: {} };
try { const u = JSON.parse(localStorage.getItem('camfluid.presets') || '{}'); for (const m of ['gas', 'flip']) if (u[m]) Object.assign(UP[m], u[m]); } catch (e) { /* storage off */ }
const saveUP = () => { try { localStorage.setItem('camfluid.presets', JSON.stringify(UP)); } catch (e) { /* storage off */ } };
let userSel = '';
function presetName() {
  for (const k of ['low', 'high']) if (Object.entries(PRESETS[ST.mode][k]).every(([key, v]) => P[key] === v)) return k;
  if (Object.keys(PRESETS[ST.mode].low).every((key) => P[key] === DEF[ST.mode][key])) return 'default';
  return '';
}

/* ── GL helpers ── */
const VS = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
uniform vec2 uTexel;
`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n')); throw new Error(gl.getShaderInfoLog(s)); } return s; }
function prog(fs, vs = VS) {
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  p.loc = {}; return p;
}
function setU(p, name, v) {
  let l = p.loc[name]; if (l === undefined) l = p.loc[name] = gl.getUniformLocation(p, name);
  if (l === null) return;
  if (v && v.isTex) { gl.activeTexture(gl.TEXTURE0 + p.unit); gl.bindTexture(gl.TEXTURE_2D, v.tex); gl.uniform1i(l, p.unit++); }
  else if (typeof v === 'number') gl.uniform1f(l, v);
  else if (v && v.int !== undefined) gl.uniform1i(l, v.int);
  else if (v.length === 2) gl.uniform2fv(l, v); else if (v.length === 3) gl.uniform3fv(l, v); else if (v.length === 4) gl.uniform4fv(l, v);
}
const VAO = gl.createVertexArray();
function texture(w, h, internal, format, type, filter) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
// a render target with 1..3 colour attachments
function target(w, h, n = 1, f32 = false) {
  const internal = f32 ? gl.RGBA32F : gl.RGBA16F, type = f32 ? gl.FLOAT : gl.HALF_FLOAT, filter = f32 ? gl.NEAREST : gl.LINEAR;
  const texs = Array.from({ length: n }, () => texture(w, h, internal, gl.RGBA, type, filter));
  const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  texs.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(texs.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { w, h, fbo, texs, t: texs.map((tex) => ({ isTex: true, tex })), get tx() { return this.t[0]; } };
}
function pair(w, h, n, f32) { const o = { a: target(w, h, n, f32), b: target(w, h, n, f32) }; o.swap = () => { const t = o.a; o.a = o.b; o.b = t; }; Object.defineProperty(o, 'r', { get: () => o.a }); Object.defineProperty(o, 'w', { get: () => o.b }); return o; }
function free(t) { if (!t) return; if (t.a) { free(t.a); free(t.b); return; } gl.deleteFramebuffer(t.fbo); if (t.colFbo) gl.deleteFramebuffer(t.colFbo); t.texs.forEach((x) => gl.deleteTexture(x)); }
function run(p, tgt, U = {}, blend = null) {
  gl.useProgram(p); p.unit = 0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, tgt ? tgt.fbo : null);
  const w = tgt ? tgt.w : canvas.width, h = tgt ? tgt.h : canvas.height;
  gl.viewport(0, 0, w, h);
  setU(p, 'uTexel', [1 / w, 1 / h]);
  for (const k in U) setU(p, k, U[k]);
  if (blend) { gl.enable(gl.BLEND); gl.blendFunc(blend[0], blend[1]); } else gl.disable(gl.BLEND);
  gl.bindVertexArray(VAO); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ── the gradient texture: 256 × N, one palette per row ── */
const gradTex = (() => {
  const W = 256, N = GRADS.length, px = new Uint8Array(W * N * 4);
  GRADS.forEach((g, r) => { for (let i = 0; i < W; i++) { const c = gradAt(g, i / (W - 1)); px.set([c[0], c[1], c[2], 255], (r * W + i) * 4); } });
  const t = texture(W, N, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.LINEAR);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, N, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return { isTex: true, tex: t };
})();

/* ── shaders ── */
const CAM_GLSL = `
uniform sampler2D uCam; uniform vec2 uCamScale;
vec3 cam(vec2 uv){ vec2 c = (vec2(1.0 - uv.x, uv.y) - 0.5) * uCamScale + 0.5; return texture(uCam, c).rgb; }
float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }`;
// speed → gradient row, or Direction: hue from the angle, value from the speed
const GRAD_GLSL = `
uniform sampler2D uGrad; uniform float uGradRow, uVmax, uDir;
vec3 hsv2rgb(vec3 c){ vec3 p = abs(fract(c.xxx + vec3(1.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0); return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y); }
vec3 grad(vec2 v){
  float s = clamp(length(v) / uVmax, 0.0, 1.0);
  if (uDir > 0.5) return hsv2rgb(vec3(atan(v.y, v.x) / 6.2831853 + 0.5, 0.85, s));
  return texture(uGrad, vec2(s, uGradRow)).rgb;
}`;
// optical flow
const S_LUM = prog(HEAD + CAM_GLSL + `
out vec4 o;
void main(){ vec2 d = uTexel * 0.5; float l = luma(cam(vUv + vec2(-d.x, -d.y))) + luma(cam(vUv + vec2(d.x, -d.y))) + luma(cam(vUv + vec2(-d.x, d.y))) + luma(cam(vUv + d)); o = vec4(l * 0.25, 0.0, 0.0, 1.0); }`);
const S_DERIV = prog(HEAD + `
uniform sampler2D uCur, uPrev;
layout(location = 0) out vec4 o0; layout(location = 1) out vec4 o1;
float I(vec2 uv){ return 0.5 * (texture(uCur, uv).r + texture(uPrev, uv).r); }
void main(){
  float ix = 0.5 * (I(vUv + vec2(uTexel.x, 0.0)) - I(vUv - vec2(uTexel.x, 0.0)));
  float iy = 0.5 * (I(vUv + vec2(0.0, uTexel.y)) - I(vUv - vec2(0.0, uTexel.y)));
  float it = texture(uCur, vUv).r - texture(uPrev, vUv).r;
  o0 = vec4(ix * ix, ix * iy, iy * iy, ix * it); o1 = vec4(iy * it, 0.0, 0.0, 1.0);
}`);
const S_BLUR2 = prog(HEAD + `
uniform sampler2D uA, uB; uniform vec2 uDir;
layout(location = 0) out vec4 o0; layout(location = 1) out vec4 o1;
void main(){

  const drawStrip = () => { const c = strip.getContext('2d'), im = c.createImageData(256, 1); for (let i = 0; i < 256; i++) { const v = gradAt(GRADS[P.grad] || GRADS[0], i / 255); im.data.set([v[0], v[1], v[2], 255], i * 4); } c.putImageData(im, 0, 0); };
  drawStrip();

  sl('exposure', 'exposure', -4, 4, 0.05, (v) => (v > 0 ? '+' : '') + v.toFixed(2) + ' EV');

}
function togglePanel() { const on = $('panel').classList.toggle('on'); $('setbtn').classList.toggle('on', on); }
