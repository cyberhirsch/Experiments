<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№ 14 — Orogeny · v001 S² Droplet</title>
<style>
  :root{
    --bg:#05070a; --ink:#e6ecf2; --dim:#7a8794; --accent:#8fc8e8; --line:rgba(230,236,242,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #panel{position:fixed;top:18px;left:18px;z-index:10;width:252px;max-height:calc(100% - 36px);
    overflow-y:auto;background:rgba(5,7,10,0.72);border:1px solid var(--line);backdrop-filter:blur(8px);
    padding:18px 18px 16px}
  #panel::-webkit-scrollbar{width:4px}
  #panel::-webkit-scrollbar-thumb{background:var(--line)}
  #panel h1{font-family:Georgia,'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:21px;letter-spacing:.02em;color:var(--accent);margin-bottom:2px}
  #panel .sub{font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
  .grp{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
    border-top:1px solid var(--line);padding-top:11px;margin:16px 0 4px;opacity:.75}
  .row{margin:11px 0}
  .row label{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .row label b{color:var(--ink);font-weight:400}
  input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);cursor:pointer}
  select{width:100%;background:rgba(5,7,10,0.9);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:10px;letter-spacing:.1em;padding:6px 8px;outline:none;cursor:pointer}
  select:hover{border-color:var(--accent)}
  .chk{display:flex;align-items:center;gap:8px;margin:11px 0}
  .chk input{width:auto;accent-color:var(--accent)}
  .chk label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    margin:0;cursor:pointer}
  .btns{display:flex;gap:8px;margin-top:16px}
  button{flex:1;background:transparent;border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:9px;letter-spacing:.2em;text-transform:uppercase;padding:8px 0;cursor:pointer;
    transition:.25s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  #diag{font-size:9px;line-height:1.85;color:var(--dim);white-space:pre-wrap;margin-top:10px;
    border-left:1px solid var(--line);padding-left:9px;min-height:14px}
  #diag b{color:var(--accent);font-weight:400}
  #diag .ok{color:#7fd6a2}
  #diag .bad{color:#e8896f}
  #hint{position:fixed;bottom:14px;left:18px;z-index:10;font-size:9px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--dim)}
  #hint b{color:var(--accent);font-weight:400}
  #hud{position:fixed;bottom:14px;right:18px;z-index:10;font-size:9px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);text-align:right;line-height:1.9}
  #hud b{color:var(--ink);font-weight:400}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:40px;z-index:20;
    background:var(--bg)}
  #err div{max-width:540px;font-size:13px;line-height:1.9;color:var(--dim)}
  #err b{color:var(--accent)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <h1>Orogeny</h1>
  <div class="sub">№ 14 · v001 — S² Droplet</div>

  <div class="grp">Tectonics</div>
  <div class="row"><label>Uplift rate <b id="vUp">0.55</b></label>
    <input id="up" type="range" min="0" max="2" step="0.01" value="0.55"></div>
  <div class="row"><label>Belt scale <b id="vBelt">1.60</b></label>
    <input id="belt" type="range" min="0.4" max="4" step="0.05" value="1.6"></div>
  <div class="row"><label>Belt sharpness <b id="vSharp">0.62</b></label>
    <input id="sharp" type="range" min="0" max="1" step="0.01" value="0.62"></div>

  <div class="grp">Erosion</div>
  <div class="row"><label>Rain rate <b id="vRain">1.00</b></label>
    <input id="rain" type="range" min="0" max="3" step="0.02" value="1"></div>
  <div class="row"><label>Erodibility <b id="vEro">0.50</b></label>
    <input id="ero" type="range" min="0" max="1.5" step="0.01" value="0.5"></div>
  <div class="row"><label>Deposition <b id="vDep">0.35</b></label>

  <div class="row"><label>Rock hardness <b id="vHard">2.20</b></label>
    <input id="hard" type="range" min="1" max="8" step="0.05" value="2.2"></div>
  <div class="row"><label>Inertia <b id="vIner">0.35</b></label>
    <input id="iner" type="range" min="0" max="0.95" step="0.01" value="0.35"></div>
  <div class="row"><label>Evaporation <b id="vEvap">0.020</b></label>
    <input id="evap" type="range" min="0.002" max="0.1" step="0.002" value="0.02"></div>

  <div class="row"><label>Sea level <b id="vSea">0.000</b></label>

    <select id="grid">
      <option value="128">6 × 128² — fast</option>

    <select id="drops">
      <option value="128">16 k</option>

    </select></div>
  <div class="row"><label>Render quality</label>
    <select id="quality">
      <option value="low">Low — 0.6× · 180 steps</option>
      <option value="med" selected>Medium — 0.85× · 300 steps</option>
      <option value="high">High — 1.0× · 460 steps</option>
      <option value="ultra">Ultra — 1.0× · 700 steps</option>
    </select></div>

  <div class="grp">View</div>
  <div class="row"><label>Shading</label>
    <select id="shade">
      <option value="0" selected>Terrain — biome palette</option>
      <option value="1">Sediment vs bedrock</option>
      <option value="2">Discharge — drainage network</option>
      <option value="3">Uplift field</option>
      <option value="4">Face id — seam check</option>
    </select></div>
  <div class="chk"><input id="water" type="checkbox" checked><label for="water">Oceans &amp; rivers</label></div>
  <div class="chk"><input id="shadow" type="checkbox" checked><label for="shadow">Cast shadows</label></div>
  <div class="chk"><input id="spin" type="checkbox" checked><label for="spin">Auto-rotate</label></div>

  <div class="grp">Verification</div>
  <div class="row"><label>Init</label>
    <select id="init">
      <option value="0" selected>Planet — fBm relief</option>
      <option value="1">Flat test — uniform shell</option>
      <option value="2">Isotropy test — corner vs face bump</option>
    </select></div>
  <div class="btns" style="margin-top:10px">
    <button id="tFlat">Flat</button>
    <button id="tIso">Isotropy</button>
    <button id="tMass">Mass</button>

  <div id="diag">idle</div>

  <div class="btns">
    <button id="reset">Reset</button>

</div>

<div id="hint">Drag <b>orbit</b> · scroll <b>zoom</b></div>
<div id="hud"></div>
<div id="err"><div></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   № 14 — OROGENY  ·  v001  ·  seamless planetary erosion on S²

   Cubed-sphere heightfield eroded by Lagrangian droplets.

   • Fields live in 6-layer TEXTURE_2D_ARRAYs, each layer (N+2)² — a 1-texel
     HALO of ghost cells around an N² interior. Every pass rewrites the halo
     by resampling the neighbouring face, so (a) all physics stencils are
     plain in-layer texelFetch and (b) hardware bilinear at a face edge blends
     against true neighbour values instead of the tile next door.
   • EQUIANGULAR cubed sphere (a = tan ξ) — cell area varies ~2× across a face
     instead of 5.2× for plain gnomonic.
   • Arc lengths are MEASURED from the 3D positions into a metric texture at
     init, not derived algebraically. Every gradient, flux and area uses them.
   • Mass moves as VOLUME. Droplets carry volume, the splat scatters volume,
     the apply pass divides by the measured cell area. Talus and creep exchange
     volume through antisymmetric fluxes. So the mass audit is meaningful.

   Passes per substep:
     1  uplift + hillslope creep      (6 draws, one per layer)
     2  droplet advect / erode        (1 draw, MRT → pos, vel, deltas)
     3  splat deltas to the grid      (6 draws, additive, POINTS)
     4  apply splat + discharge       (6 draws)
     5  talus relaxation              (6 draws)
   then one raymarch of the displaced shell.
   ═══════════════════════════════════════════════════════════════════════════ */

const errEl = document.getElementById('err');
function fail(msg){ errEl.style.display='grid'; errEl.firstElementChild.innerHTML = msg; throw new Error(msg.replace(/<[^>]+>/g,'')); }

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, depth:false, alpha:false, powerPreference:'high-performance'});
if(!gl) fail("This experiment needs <b>WebGL2</b>.<br><br>Use a recent desktop Chrome, Edge, Firefox or Safari with hardware acceleration enabled.");

const extCBF = gl.getExtension('EXT_color_buffer_float');
if(!extCBF) fail("Your browser has WebGL2 but not <b>EXT_color_buffer_float</b>.<br><br>The simulation renders into floating-point textures and cannot run without it.");
const extFL  = gl.getExtension('OES_texture_float_linear');   // optional — manual bilinear fallback
const extFB  = gl.getExtension('EXT_float_blend');            // optional — 32-bit splat accumulation

const LINEAR_OK = !!extFL;
const SPLAT_F32 = !!extFB;

/* ───────────────────────────── parameters ───────────────────────────── */
let N  = 512;      // interior cells per face edge
let PD = 512;      // droplet texture edge (PD² droplets)

const P = {
  uplift:0.55, belt:1.6, sharp:0.62,
  rain:1.0, erodibility:0.5, deposition:0.35, hardness:2.2,
  inertia:0.35, evaporation:0.02, creep:0.3, repose:0.7,
  sea:0.0, dt:1.0,
  shade:0, water:1, shadow:1, spin:1, initMode:0,
  steps:300, pixScale:0.85
};

const R0 = 1.0;             // planet radius, world units
const HMAX = 0.075;         // shell half-thickness the marcher brackets
/* Erosive throughput per substep is bounded by droplet COVERAGE — only a cell
   that a droplet visits can be cut, so ~PD²/6N² of the grid is eligible each
   step. Uplift has no such bound. Tie the uplift rate to coverage and the
   uplift/erosion balance holds at every grid and droplet count instead of
   having to be re-tuned for each. */
const UPLIFT_BASE = 1.1e-5;
let UPLIFT_SCALE = UPLIFT_BASE;
let ALLOW_K = 0.6;          // max fraction of the drop to the lowest neighbour cut per step
const SPLAT_GAIN = 1.0e4;   // keeps per-droplet contributions out of half-float sub-normals
let CAP_K = 60.0;           // sediment-capacity constant — sets the load a droplet can hold
let   seed = 1337;

/* ───────────────────────────── GL helpers ───────────────────────────── */
function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    const numbered = src.split('\n').map((l,i)=>String(i+1).padStart(4)+' | '+l).join('\n');
    console.error(log+'\n'+numbered);
    fail("Shader compile failed:<br><br><b>"+log.split('\n')[0]+"</b><br><br>See the browser console for the annotated source.");
  }
  return s;
}
function prog(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS))
    fail("Program link failed:<br><br><b>"+gl.getProgramInfoLog(p)+"</b>");
  p._u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const info = gl.getActiveUniform(p,i); const nm = info.name.replace(/\[0\]$/,'');
    p._u[nm] = gl.getUniformLocation(p, nm); }
  return p;
}
function U(p, name){ return p._u[name] !== undefined ? p._u[name] : null; }

function tex2DArray(w, h, layers, internal, format, type, filter){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, internal, w, h, layers);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  t._w=w; t._h=h; t._l=layers;
  return t;
}
function tex2D(w, h, internal){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, internal, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  t._w=w; t._h=h;
  return t;
}
function bindLayer(fb, tex, layer){
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex, 0, layer);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
}
function unit(i, tex, target){
  gl.activeTexture(gl.TEXTURE0 + i);
  gl.bindTexture(target || gl.TEXTURE_2D_ARRAY, tex);
  return i;
}

/* ─────────────────────────── shared GLSL ─────────────────────────── */
/*  The cubed-sphere chart machinery. dirToFace / faceToDir follow № 02's
    axis convention exactly so the two experiments agree on what face 3 is;
    the tan/atan pair upgrades it from gnomonic to equiangular.            */
const COMMON = `
const float PI4 = 0.7853981633974483;
uniform float uN;          // interior cells per face edge
uniform float uNT;         // uN + 2.0, the stored texture edge

// local face coord s in [0,1] over the INTERIOR (values slightly outside = halo)
vec3 faceToDir(int face, vec2 s){
  vec2 c = tan((s*2.0-1.0)*PI4);
  if (face==0) return vec3( 1.0,  c.y, -c.x);
  if (face==1) return vec3(-1.0,  c.y,  c.x);
  if (face==2) return vec3( c.x,  1.0, -c.y);
  if (face==3) return vec3( c.x, -1.0,  c.y);
  if (face==4) return vec3( c.x,  c.y,  1.0);
  return             vec3(-c.x,  c.y, -1.0);
}
void dirToFace(vec3 d, out int face, out vec2 s){
  vec3 a = abs(d); vec2 uv;
  if (a.x >= a.y && a.x >= a.z){
    if (d.x > 0.0){ face=0; uv = vec2(-d.z, d.y)/a.x; } else { face=1; uv = vec2( d.z, d.y)/a.x; }
  } else if (a.y >= a.x && a.y >= a.z){
    if (d.y > 0.0){ face=2; uv = vec2( d.x,-d.z)/a.y; } else { face=3; uv = vec2( d.x, d.z)/a.y; }
  } else {
    if (d.z > 0.0){ face=4; uv = vec2( d.x, d.y)/a.z; } else { face=5; uv = vec2(-d.x, d.y)/a.z; }
  }
  s = atan(uv)/PI4*0.5 + 0.5;
}
// interior-local s  →  texture uv inside the (N+2)² halo'd layer
vec2 sToUv(vec2 s){ return (s*uN + 1.0)/uNT; }
// fragment position  →  interior-local s   (gl_FragCoord.xy = texelIndex + 0.5)
vec2 fragToS(vec2 fc){ return (fc - 1.0)/uN; }

vec4 fetchDir(sampler2DArray T, vec3 d){
  int f; vec2 s; dirToFace(normalize(d), f, s);
  ${LINEAR_OK ? `return texture(T, vec3(sToUv(s), float(f)));`
              : `vec2 p = sToUv(s)*uNT - 0.5; vec2 fr = fract(p); ivec2 i0 = ivec2(floor(p));
                 vec4 a = texelFetch(T, ivec3(i0                , f), 0);
                 vec4 b = texelFetch(T, ivec3(i0+ivec2(1,0)     , f), 0);
                 vec4 c = texelFetch(T, ivec3(i0+ivec2(0,1)     , f), 0);
                 vec4 e = texelFetch(T, ivec3(i0+ivec2(1,1)     , f), 0);
                 return mix(mix(a,b,fr.x), mix(c,e,fr.x), fr.y);`}
}
// orthonormal tangent basis at a unit direction
void basis(vec3 n, out vec3 e1, out vec3 e2){
  vec3 up = abs(n.z) < 0.9 ? vec3(0.0,0.0,1.0) : vec3(1.0,0.0,0.0);
  e1 = normalize(cross(up, n));
  e2 = cross(n, e1);
}
float hash11(float p){ p = fract(p*0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash13(vec3 q){ vec3 p3 = fract(q*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x); vec3 u = f*f*(3.0-2.0*f);
  float a=hash13(i), b=hash13(i+vec3(1,0,0)), c=hash13(i+vec3(0,1,0)), d=hash13(i+vec3(1,1,0));
  float e=hash13(i+vec3(0,0,1)), g=hash13(i+vec3(1,0,1)), h=hash13(i+vec3(0,1,1)), k=hash13(i+vec3(1,1,1));
  return mix(mix(mix(a,b,u.x), mix(c,d,u.x), u.y), mix(mix(e,g,u.x), mix(h,k,u.x), u.y), u.z);
}
float fbm(vec3 p, int oct){
  float a=0.5, s=0.0, n=0.0;
  for(int i=0;i<8;i++){ if(i>=oct) break; s += a*vnoise(p); n += a; p *= 2.03; a *= 0.5; }
  return s/max(n,1e-5);
}
float ridged(vec3 p, int oct){
  float a=0.5, s=0.0, n=0.0;
  for(int i=0;i<8;i++){ if(i>=oct) break;
    s += a*(1.0 - abs(vnoise(p)*2.0-1.0)); n += a; p *= 2.07; a *= 0.5; }
  return s/max(n,1e-5);
}
`;

const VS_QUAD = `#version 300 es
void main(){
  vec2 v = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
  gl_Position = vec4(v*2.0-1.0, 0.0, 1.0);
}`;

/* Boilerplate for every field pass: decide interior vs halo, and for halo
   texels resample the neighbouring face from the SOURCE texture. */
const HALO = `
bool haloFill(sampler2DArray SRC, vec2 s, int face, out vec4 outv){
  if (s.x > 0.0 && s.x < 1.0 && s.y > 0.0 && s.y < 1.0) return false;
  outv = fetchDir(SRC, faceToDir(face, s));
  return true;
}`;

/* ─────────────────── pass 0a: metric (arc lengths, area) ─────────────────── */
const FS_METRIC = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
uniform int uFace; uniform float uR;
layout(location=0) out vec4 oM;    // arc lengths E, W, N, S
layout(location=1) out vec4 oA;    // exact cell area

void main(){
  vec2 s = fragToS(gl_FragCoord.xy);
  float d = 1.0/uN, hf = 0.5/uN;
  vec3 c  = normalize(faceToDir(uFace, s));
  vec3 pe = normalize(faceToDir(uFace, s + vec2( d,0.0)));
  vec3 pw = normalize(faceToDir(uFace, s + vec2(-d,0.0)));
  vec3 pn = normalize(faceToDir(uFace, s + vec2(0.0, d)));
  vec3 ps = normalize(faceToDir(uFace, s + vec2(0.0,-d)));
  // chord ≈ arc: θ ~ π/(2N) ≲ 3e-3 rad, relative error θ²/24 ≲ 4e-7
  oM = vec4(length(pe-c), length(pw-c), length(pn-c), length(ps-c)) * uR;

  // cell area from the analytic area element of the equiangular cubed sphere:
  //   dA = (1+X²)(1+Y²)·δ⁻³ dξ dη,  X = tan ξ, Y = tan η, δ² = 1+X²+Y²
  // A rectangle of the centred spacings is 1.6 % out; the spherical-excess
  // formula is exact but cancels catastrophically in fp32 at these sizes.
  vec2 XY = tan((s*2.0-1.0)*PI4);
  float d2 = 1.0 + XY.x*XY.x + XY.y*XY.y;
  float dxi = 2.0*PI4/uN;
  float area = (1.0+XY.x*XY.x)*(1.0+XY.y*XY.y)/(d2*sqrt(d2)) * dxi*dxi;
  oA = vec4(area*uR*uR, 0.0, 0.0, 1.0);
}`;

/* ─────────────────── pass 0b: uplift field (static per seed) ─────────────────── */
const FS_UPLIFT = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
uniform int uFace; uniform float uBelt, uSharp, uSeed; uniform int uFlat;
out vec4 o;
void main(){
  if (uFlat == 1){ o = vec4(1.0, 0.0, 0.0, 1.0); return; }   // flat test: uniform source term
  vec2 s = fragToS(gl_FragCoord.xy);
  vec3 d = normalize(faceToDir(uFace, s));
  vec3 q = d*uBelt*3.0 + uSeed;
  // domain-warped ridged fBm: long sinuous belts rather than isotropic blobs
  vec3 w = vec3(fbm(q*0.7+11.3,3), fbm(q*0.7+41.7,3), fbm(q*0.7+77.1,3)) - 0.5;
  float r = ridged(q + w*1.4, 5);
  float belt = smoothstep(0.55 - 0.35*(1.0-uSharp), 0.62 + 0.30*(1.0-uSharp), r);
  // a slow continental swell underneath, so ranges sit on high ground
  float swell = fbm(d*1.35 + uSeed*0.37, 3);
  o = vec4(belt*0.85 + swell*0.35, 0.0, 0.0, 1.0);
}`;

/* ─────────────────── pass 0c: initial terrain ─────────────────── */
const FS_INIT = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
uniform int uFace; uniform float uSeed; uniform int uMode;
out vec4 o;
void main(){
  vec2 s = fragToS(gl_FragCoord.xy);
  vec3 d = normalize(faceToDir(uFace, s));
  float rock = 0.0;
  if (uMode == 0){
    vec3 q = d*2.2 + uSeed;
    vec3 w = vec3(fbm(q+3.1,3), fbm(q+13.7,3), fbm(q+29.3,3)) - 0.5;
    rock = (fbm(q + w*0.9, 6) - 0.5) * 0.030;
  } else if (uMode == 1){
    rock = 0.010;                       // flat test — a perfectly uniform shell
  } else {
    // isotropy test — identical bumps at a cube CORNER and a face CENTRE
    vec3 corner = normalize(vec3(1.0,1.0,1.0));
    vec3 centre = vec3(1.0,0.0,0.0);
    float ac = acos(clamp(dot(d,corner),-1.0,1.0));
    float af = acos(clamp(dot(d,centre),-1.0,1.0));
    float sg = 0.16;
    rock = 0.004 + 0.028*(exp(-ac*ac/(2.0*sg*sg)) + exp(-af*af/(2.0*sg*sg)));
  }
  o = vec4(rock, 0.0, 0.0, 1.0);        // r = bedrock, g = sediment
}`;

/* ─────────────────── pass 1: uplift + hillslope creep ───────────────────
   Creep is a VOLUME flux with a symmetric coefficient, so it conserves
   exactly: ΔV_i = D·dt·(h_j−h_i)·√(A_i·A_j)/dist², Δh_i = ΔV_i/A_i.      */
const FS_STEP = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
${HALO}
uniform sampler2DArray uT, uM, uA, uU;
uniform int uFace; uniform float uDt, uUplift, uCreep, uUMean, uLith, uSedMax;
out vec4 o;

void main(){
  vec2 s = fragToS(gl_FragCoord.xy);
  vec4 h; if (haloFill(uT, s, uFace, h)){ o = h; return; }

  ivec3 t = ivec3(gl_FragCoord.xy, uFace);
  vec4 me = texelFetch(uT, t, 0);
  vec4 m  = texelFetch(uM, t, 0);
  float A = max(texelFetch(uA, t, 0).x, 1e-14);

  vec4 nb[4]; float An[4]; float dst[4];
  nb[0]=texelFetch(uT,t+ivec3( 1,0,0),0); An[0]=texelFetch(uA,t+ivec3( 1,0,0),0).x; dst[0]=m.x;
  nb[1]=texelFetch(uT,t+ivec3(-1,0,0),0); An[1]=texelFetch(uA,t+ivec3(-1,0,0),0).x; dst[1]=m.y;
  nb[2]=texelFetch(uT,t+ivec3(0, 1,0),0); An[2]=texelFetch(uA,t+ivec3(0, 1,0),0).x; dst[2]=m.z;
  nb[3]=texelFetch(uT,t+ivec3(0,-1,0),0); An[3]=texelFetch(uA,t+ivec3(0,-1,0),0).x; dst[3]=m.w;

  float hme = me.x + me.y;
  float dV = 0.0;
  for(int i=0;i<4;i++){
    float hn = nb[i].x + nb[i].y;
    float d  = max(dst[i], 1e-9);
    float L  = sqrt(A*An[i])/d;                  // symmetric edge-length proxy
    dV += uCreep*uDt*(hn - hme)*L/d;             // uCreep carries the dx² normaliser
  }
  float dh = dV/max(A,1e-12);

  // Mean-zero: belts rise, everything else subsides by the area-weighted mean.
  // A closed sphere with a source and no sink can only inflate — the mean radius
  // grows at exactly the uplift rate forever. Real uplift is isostatic, i.e. crust
  // rearranged rather than created, so removing the mean is both the physical and
  // the numerical answer. It also makes total volume a conserved quantity.
  float up = (texelFetch(uU, t, 0).x - uUMean) * uUplift * uDt;

  // creep works the loose layer first, then bites bedrock
  float sed = me.y, rock = me.x;
  float toSed = clamp(dh, -sed, 1e9);
  sed  += toSed;
  rock += (dh - toSed) + up;

  // Lithification. Nothing on a closed sphere removes sediment, so without a
  // return path the whole planet slowly disappears under its own debris. Burial
  // below the top few metres compacts back to bedrock — mass-conserving, and it
  // is what actually happens to a basin fill.
  float bury = max(sed - uSedMax, 0.0)*uLith*uDt;
  sed  -= bury;
  rock += bury;

  o = vec4(rock, max(sed,0.0), 0.0, 1.0);
}`;

/* ─────────────────── pass 2: droplet advect / erode ───────────────────
   Each droplet takes ONE step per substep, so a droplet traces a continuous
   path over many frames — a persistent rain rather than a burst. Gradients
   are measured in world arc length along a tangent basis, which makes the
   step metric-correct on every face and across every seam without touching
   the metric texture.                                                     */
const FS_DROP = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
uniform sampler2D uPos, uVel;
uniform sampler2DArray uT, uA;
uniform float uDt, uInertia, uErod, uDepo, uHard, uEvap, uRain, uSea, uFrame, uSeed, uAref, uCap;
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oVel;
layout(location=2) out vec4 oEro;

vec3 respawn(float id){
  float a = hash11(id*1.13 + uFrame*0.017 + uSeed);
  float b = hash11(id*7.71 + uFrame*0.031 + uSeed*3.7);
  float z = a*2.0 - 1.0, th = b*6.2831853;
  float r = sqrt(max(0.0, 1.0 - z*z));
  return vec3(r*cos(th), r*sin(th), z);
}

void main(){
  ivec2 tc = ivec2(gl_FragCoord.xy);
  float id = gl_FragCoord.y*4096.0 + gl_FragCoord.x;

  vec4 Pw = texelFetch(uPos, tc, 0);
  vec4 Vs = texelFetch(uVel, tc, 0);
  vec3 p = Pw.xyz; float water = Pw.w;
  vec3 v = Vs.xyz; float sed = Vs.w;

  if (water <= 0.0 || dot(p,p) < 0.5){          // fresh droplet
    p = respawn(id); v = vec3(0.0); water = uRain; sed = 0.0;
    oPos = vec4(p, water); oVel = vec4(v, sed); oEro = vec4(0.0);
    return;
  }
  p = normalize(p);

  vec3 e1, e2; basis(p, e1, e2);
  float step = 1.5708/uN;                        // one cell, in radians ≈ world units at R=1
  vec2 h0 = fetchDir(uT, p).rg;
  float H  = h0.r + h0.g;

  // measured tangent gradient of the surface
  float hxp = dot(fetchDir(uT, normalize(p + e1*step)).rg, vec2(1.0));
  float hxm = dot(fetchDir(uT, normalize(p - e1*step)).rg, vec2(1.0));
  float hyp = dot(fetchDir(uT, normalize(p + e2*step)).rg, vec2(1.0));
  float hym = dot(fetchDir(uT, normalize(p - e2*step)).rg, vec2(1.0));
  vec3 grad = (e1*(hxp-hxm) + e2*(hyp-hym)) / (2.0*step);

  vec3 dir = v*uInertia - grad*(1.0-uInertia);
  dir -= p*dot(dir,p);
  float dl = length(dir);
  if (dl < 1e-7){                                 // flat spot: nudge, do not stall
    dir = e1*(hash11(id+uFrame)*2.0-1.0) + e2*(hash11(id*3.1+uFrame)*2.0-1.0);
    dir -= p*dot(dir,p); dl = max(length(dir),1e-7);
  }
  dir /= dl;

  vec3 pn = normalize(p + dir*step);
  vec2 h1 = fetchDir(uT, pn).rg;
  float Hn = h1.r + h1.g;
  float dH = Hn - H;

  // work in SLOPE, not raw Δh, so the constants are resolution-independent
  float slope = -dH/step;
  float spd = length(v);
  spd = min(sqrt(max(0.0, spd*spd + slope*4.0)), 3.0);

  // relative cell area a = A/Aref. Loads and capacities are VOLUMES expressed
  // in reference-cell depth, so a droplet carries the same mass across a seam
  // even though the cells either side differ in size.
  float a = max(fetchDir(uA, p).x, 1e-14)/uAref;

  float capH = max(slope, 0.01) * spd * water * uCap * step;  // a depth
  float capV = capH * a;

  // This pass only DECLARES what it wants; it does not touch its own load.
  // Hundreds of droplets can funnel through one channel cell in a step, and if
  // each acted on the same stale height they would between them cut deeper than
  // the whole relief — the pit then steepens and the next step is worse. So the
  // grid arbitrates: the apply pass grants a fraction g of the total demand,
  // and pass 2b hands each droplet g × its own demand. P2G, then G2P.
  float wantV = 0.0, dropV = 0.0;
  if (sed > capV || dH > 0.0){
    dropV = (dH > 0.0) ? min(dH*a, sed) : (sed - capV)*uDepo;
    dropV = max(dropV, 0.0);
  } else {
    wantV = max((capV - sed)*uErod, 0.0);
  }

  water *= (1.0 - uEvap*uDt);

  // sink at base level or when spent: put the load down, then retire
  bool dead = (water < 0.02) || (Hn < uSea);
  if (dead){ dropV = sed; wantV = 0.0; water = 0.0; }

  oPos = vec4(pn, water);
  oVel = vec4(dir*spd, sed);                     // load unchanged here
  oEro = vec4(dropV, wantV, Pw.w, dead ? 1.0 : 0.0);
}`;

/* ─────────────────── pass 3: splat droplet deltas ───────────────────
   PointSize 1: a droplet writes exactly one texel, so nothing spills into a
   halo and mass is conserved bit-for-bit at seams. Stipple is answered by
   droplet count and by creep, not by a fat brush.                        */
const VS_SPLAT = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
uniform sampler2D uPos, uEro;
uniform int uFace; uniform float uPD, uGain;
out vec4 vD;
void main(){
  int id = gl_VertexID;
  int w  = int(uPD);
  ivec2 tc = ivec2(id % w, id / w);
  vec4 Pw = texelFetch(uPos, tc, 0);
  // A single droplet's demand is ~3e-5 — below half-float's smallest normal
  // (6.1e-5), so it lands in the sub-normal range that most GPUs flush to zero.
  // The grid then saw no demand while the droplets still collected one: mass out
  // of nothing. The gain lifts every contribution into the normal range.
  vD = texelFetch(uEro, tc, 0)*uGain;
  int f; vec2 s;
  dirToFace(normalize(Pw.xyz), f, s);
  gl_PointSize = 1.0;
  if (f != uFace || Pw.w <= 0.0 || dot(Pw.xyz,Pw.xyz) < 0.5){
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);      // clipped
    return;
  }
  gl_Position = vec4(sToUv(s)*2.0 - 1.0, 0.0, 1.0);
}`;
const FS_SPLAT = `#version 300 es
precision highp float;
in vec4 vD; out vec4 o;
void main(){ o = vD; }`;

/* ─────────────────── pass 4: apply splat + discharge ───────────────────
   The splat holds VOLUME. Dividing by the measured cell area here is what
   makes an erosion event cost the same mass in a big cell as in a small one. */
const FS_APPLY = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
${HALO}
uniform sampler2DArray uT, uS, uA, uF;
uniform int uFace; uniform float uDt, uAref, uHard, uGain, uAllow, uQScale;
layout(location=0) out vec4 oT;
layout(location=1) out vec4 oF;

void main(){
  vec2 s = fragToS(gl_FragCoord.xy);
  vec4 hh, ff;
  bool halo = haloFill(uT, s, uFace, hh);
  if (halo){ haloFill(uF, s, uFace, ff); oT = hh; oF = ff; return; }

  ivec3 t = ivec3(gl_FragCoord.xy, uFace);
  vec4 me = texelFetch(uT, t, 0);
  vec4 sp = texelFetch(uS, t, 0)/uGain;
  float a = max(texelFetch(uA, t, 0).x, 1e-14)/uAref;   // relative cell area

  // the splat holds volume in reference-cell depth; /a turns it into a depth here
  float deposit = sp.x/a;
  float demand  = sp.y/a;

  // A cell may not be cut more than a quarter of the way down to its lowest
  // neighbour in one step. In a pit the allowance is zero, so pits fill instead
  // of digging — which is also what water does.
  float hme = me.x + me.y;
  float lowest = hme;
  lowest = min(lowest, texelFetch(uT,t+ivec3( 1,0,0),0).x + texelFetch(uT,t+ivec3( 1,0,0),0).y);
  lowest = min(lowest, texelFetch(uT,t+ivec3(-1,0,0),0).x + texelFetch(uT,t+ivec3(-1,0,0),0).y);
  lowest = min(lowest, texelFetch(uT,t+ivec3(0, 1,0),0).x + texelFetch(uT,t+ivec3(0, 1,0),0).y);
  lowest = min(lowest, texelFetch(uT,t+ivec3(0,-1,0),0).x + texelFetch(uT,t+ivec3(0,-1,0),0).y);
  float allowed = uAllow*max(hme - lowest, 0.0);
  // Fail to ZERO, never to one. If a droplet's demand failed to register here,
  // granting it in full would hand out material the ground never gave up — an
  // unbounded source. Granting nothing is a bounded loss instead.
  float g = demand > 1e-20 ? min(1.0, allowed/demand) : 0.0;

  float cut   = demand*g;
  float loose = max(me.y + deposit, 0.0);
  float fromSed   = min(cut, loose);
  float fromRock  = (cut - fromSed)/uHard;       // hard rock yields less per unit of work
  float removed   = fromSed + fromRock;
  // the fraction each droplet actually gets — hardness included, so what the
  // ground loses and what the droplets gain are the same number
  float gEff = demand > 1e-20 ? removed/demand : 0.0;

  float sed  = loose - fromSed;
  float rock = me.x - fromRock;
  if (sed < 0.0){ rock += sed; sed = 0.0; }

  // Discharge, in multiples of AVERAGE traffic — so "q = 20" means twenty times
  // the water an average cell sees, at any grid size or droplet count, and the
  // river threshold downstream does not need re-tuning per setting.
  float q = texelFetch(uF, t, 0).x;
  float inst = sp.z/a*uQScale;
  q = mix(q, inst, clamp(0.10*uDt, 0.0, 1.0));

  oT = vec4(rock, sed, 0.0, 1.0);
  oF = vec4(q, gEff, 0.0, 1.0);                  // .y is the grant, read back by 2b
}`;

/* ─────────────────── pass 5: talus / angle of repose ───────────────────
   Antisymmetric volume exchange: both cells of a pair compute an identical
   magnitude from identical inputs, so no sediment is invented or destroyed
   at a cliff edge — the trap № 11 hit and documented.                     */
const FS_TALUS = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
${HALO}
uniform sampler2DArray uT, uM, uA;
uniform int uFace; uniform float uRepose, uDt;
out vec4 o;

void main(){
  vec2 s = fragToS(gl_FragCoord.xy);
  vec4 h; if (haloFill(uT, s, uFace, h)){ o = h; return; }

  ivec3 t = ivec3(gl_FragCoord.xy, uFace);
  vec4 me = texelFetch(uT, t, 0);
  vec4 mm = texelFetch(uM, t, 0);
  float A = max(texelFetch(uA, t, 0).x, 1e-14);
  float hme = me.x + me.y;

  vec4 nb[4]; float dst[4]; float An[4];
  nb[0]=texelFetch(uT,t+ivec3( 1,0,0),0); dst[0]=mm.x; An[0]=texelFetch(uA,t+ivec3( 1,0,0),0).x;
  nb[1]=texelFetch(uT,t+ivec3(-1,0,0),0); dst[1]=mm.y; An[1]=texelFetch(uA,t+ivec3(-1,0,0),0).x;
  nb[2]=texelFetch(uT,t+ivec3(0, 1,0),0); dst[2]=mm.z; An[2]=texelFetch(uA,t+ivec3(0, 1,0),0).x;
  nb[3]=texelFetch(uT,t+ivec3(0,-1,0),0); dst[3]=mm.w; An[3]=texelFetch(uA,t+ivec3(0,-1,0),0).x;

  float dV = 0.0;
  for(int i=0;i<4;i++){
    float hn   = nb[i].x + nb[i].y;
    float diff = hme - hn;                        // >0 → I am the giver
    float d    = max(dst[i], 1e-9);
    float over = abs(diff)/d - uRepose;           // slope beyond repose
    if (over <= 0.0) continue;
    // rate ∝ d keeps Δh ≈ 0.15·diff — stable, and still metric-weighted
    float mag  = 0.15*uDt * over * d * sqrt(A*An[i]);     // identical on both sides
    // 1/8, not 1/2: a cell can be the giver to all four neighbours at once, and
    // clamping a negative result afterwards would invent sediment
    float give = (diff > 0.0) ? me.y*A : nb[i].y*An[i];   // giver's stock, both agree
    mag = min(mag, give*0.125);
    dV += (diff > 0.0) ? -mag : mag;
  }
  float sed = max(me.y + dV/A, 0.0);
  o = vec4(me.x, sed, 0.0, 1.0);
}`;

/* ─────────────────── render: raymarch the displaced shell ─────────────────── */
const FS_RENDER = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
uniform sampler2DArray uT, uF, uU;
uniform vec3 uEye, uFwd, uRight, uUp, uSun;
uniform vec2 uRes;
uniform float uTanFov, uSteps, uSea, uR, uHmax;
uniform int uShade, uWater, uShadow;
out vec4 frag;

float surf(vec3 d){ vec2 h = fetchDir(uT, d).rg; return uR + h.r + h.g; }

bool sphere(vec3 ro, vec3 rd, float r, out float t0, out float t1){
  float b = dot(ro, rd), c = dot(ro,ro) - r*r;
  float disc = b*b - c;
  if (disc < 0.0) return false;
  float sq = sqrt(disc);
  t0 = -b - sq; t1 = -b + sq;
  return t1 > 0.0;
}

// march the shell; returns distance to the terrain hit or -1
float trace(vec3 ro, vec3 rd, float steps){
  float t0, t1;
  if (!sphere(ro, rd, uR + uHmax, t0, t1)) return -1.0;
  float t = max(t0, 0.0);
  float tEnd = t1;
  float inner0, inner1;
  if (sphere(ro, rd, uR - uHmax, inner0, inner1) && inner0 > 0.0) tEnd = min(tEnd, inner0);
  float minStep = 1.5708/uN*0.45;
  float prev = 0.0; float prevT = t; bool have = false;
  for (float i = 0.0; i < steps; i += 1.0){
    if (t > tEnd) break;
    vec3 p = ro + rd*t;
    float r = length(p);
    float f = r - surf(p/r);
    if (f < 0.0){
      // bisect between the last outside sample and here
      float a = have ? prevT : max(t0,0.0), b = t;
      for (int k = 0; k < 7; k++){
        float mid = 0.5*(a+b);
        vec3 pm = ro + rd*mid; float rm = length(pm);
        if (rm - surf(pm/rm) < 0.0) b = mid; else a = mid;
      }
      return 0.5*(a+b);
    }
    prev = f; prevT = t; have = true;
    t += max(f*0.55, minStep);
  }
  return -1.0;
}

vec3 normalAt(vec3 p){
  vec3 n = normalize(p);
  vec3 e1, e2; basis(n, e1, e2);
  float st = 1.5708/uN;
  float a = surf(normalize(n + e1*st)), b = surf(normalize(n - e1*st));
  float c = surf(normalize(n + e2*st)), d = surf(normalize(n - e2*st));
  vec3 g = e1*(a-b)/(2.0*st) + e2*(c-d)/(2.0*st);
  return normalize(n - g);
}

float shadow(vec3 p){
  if (uShadow == 0) return 1.0;
  vec3 n = normalize(p);
  vec3 sd = normalize(uSun - n*dot(uSun,n));
  float st = 1.5708/uN;
  float h0 = surf(n);
  float occ = 0.0;
  for (int i = 1; i <= 10; i++){
    float d = float(i)*st*2.2;
    vec3 q = normalize(n + sd*d);
    float rise = (surf(q) - h0)/d;               // apparent slope to the sample
    occ = max(occ, rise);
  }
  float sunEl = dot(uSun, n);
  return 1.0 - smoothstep(sunEl - 0.03, sunEl + 0.10, occ);
}

vec3 palette(vec3 p, vec3 n, vec2 h, float q, float up){
  float H = h.r + h.g - uR + uR - uR;            // relief above datum
  H = h.r + h.g;
  float alt   = clamp((H - uSea)/0.035, 0.0, 1.0);
  float sedf  = clamp(h.g/0.0035, 0.0, 1.0);
  float slope = 1.0 - clamp(dot(n, normalize(p)), 0.0, 1.0);
  slope = clamp(slope*6.0, 0.0, 1.0);

  if (uShade == 1) return mix(vec3(0.30,0.31,0.34), vec3(0.86,0.70,0.44), sedf);
  if (uShade == 2){
    float f = clamp(log(1.0 + q)/log(60.0), 0.0, 1.0);
    return mix(vec3(0.05,0.06,0.09), vec3(0.35,0.78,1.0), f);
  }
  if (uShade == 3) return mix(vec3(0.06,0.07,0.10), vec3(1.0,0.55,0.30), clamp(up,0.0,1.0));
  if (uShade == 4){
    int f; vec2 s; dirToFace(normalize(p), f, s);
    vec3 cols[6];
    cols[0]=vec3(0.9,0.3,0.3); cols[1]=vec3(0.3,0.9,0.4); cols[2]=vec3(0.35,0.5,1.0);
    cols[3]=vec3(0.9,0.85,0.3); cols[4]=vec3(0.9,0.4,0.9); cols[5]=vec3(0.3,0.9,0.9);
    vec2 e = min(s, 1.0-s);
    float edge = smoothstep(0.0, 2.5/uN, min(e.x, e.y));
    return mix(vec3(1.0), cols[f], 0.35 + 0.65*edge);
  }

  vec3 low  = vec3(0.20,0.30,0.16);              // lowland green
  vec3 mid  = vec3(0.36,0.32,0.22);              // dry upland
  vec3 rock = vec3(0.30,0.29,0.30);              // exposed bedrock
  vec3 snow = vec3(0.92,0.94,0.97);
  vec3 sand = vec3(0.72,0.63,0.45);

  vec3 c = mix(low, mid, smoothstep(0.10, 0.45, alt));
  c = mix(c, rock, smoothstep(0.35, 0.75, alt));
  c = mix(c, rock, slope*0.65);
  c = mix(c, sand, sedf*0.55*(1.0 - smoothstep(0.55,0.85,alt)));
  float snowline = smoothstep(0.72, 0.92, alt) * (1.0 - slope*0.55);
  c = mix(c, snow, clamp(snowline, 0.0, 1.0));
  // coastal bleach
  c = mix(vec3(0.74,0.68,0.52), c, smoothstep(0.0, 0.045, alt));
  return c;
}

void main(){
  vec2 uv = (gl_FragCoord.xy/uRes)*2.0 - 1.0;
  uv.x *= uRes.x/uRes.y;
  vec3 rd = normalize(uFwd + uRight*uv.x*uTanFov + uUp*uv.y*uTanFov);
  vec3 ro = uEye;

  vec3 col;
  float t = trace(ro, rd, uSteps);

  // ocean shell
  float so0, so1; bool seaHit = false; float tSea = 1e9;
  if (uWater == 1 && sphere(ro, rd, uR + uSea, so0, so1) && so0 > 0.0){ seaHit = true; tSea = so0; }

  bool land = t > 0.0 && (!seaHit || t < tSea);

  if (land){
    vec3 p = ro + rd*t;
    vec3 n = normalAt(p);
    vec3 d = normalize(p);
    vec2 h = fetchDir(uT, d).rg;
    float q = fetchDir(uF, d).r;
    float up = fetchDir(uU, d).r;
    vec3 base = palette(p, n, h, q, up);

    // rivers: discharge above threshold, above base level
    float riv = 0.0;
    if (uWater == 1 && uShade == 0){
      riv = smoothstep(2.0, 8.0, q);       // ≈4 % of cells partially, 0.4 % fully
      base = mix(base, vec3(0.12,0.28,0.40), riv*0.85);
    }

    float sun = max(dot(n, uSun), 0.0) * shadow(p);
    float sky = 0.35 + 0.35*dot(n, normalize(p));
    col = base*(sun*1.25 + sky*0.30);
    col += vec3(0.35,0.55,0.85)*riv*pow(max(dot(reflect(-uSun,n), -rd),0.0), 48.0)*sun*0.9;
  } else if (seaHit){
    vec3 p = ro + rd*tSea;
    vec3 n = normalize(p);
    vec2 h = fetchDir(uT, n).rg;
    if (h.r + h.g >= uSea){
      col = vec3(0.02,0.03,0.05);                // shell hit but land is above: sky
      land = false; seaHit = false;
    } else {
      float depth = clamp((uSea - (h.r+h.g))/0.02, 0.0, 1.0);
      vec3 deep = vec3(0.014,0.055,0.115), shallow = vec3(0.09,0.32,0.42);
      vec3 base = mix(shallow, deep, depth);
      float sun = max(dot(n, uSun), 0.0);
      float spec = pow(max(dot(reflect(-uSun,n), -rd), 0.0), 90.0);
      col = base*(sun*1.05 + 0.10) + vec3(0.8,0.9,1.0)*spec*sun*0.7;
      float fres = pow(1.0 - max(dot(n,-rd),0.0), 4.0);
      col = mix(col, vec3(0.25,0.42,0.62), fres*0.5);
    }
  }

  if (!land && !seaHit){
    float st = hash13(floor(rd*900.0));
    col = vec3(0.006,0.009,0.014) + vec3(step(0.9994, st))*0.9;
    // atmospheric limb
    float t0,t1;
    if (sphere(ro, rd, uR + uHmax*2.6, t0, t1)){
      float chord = max(t1 - max(t0,0.0), 0.0);
      col += vec3(0.18,0.36,0.72) * clamp(chord*2.4, 0.0, 1.0) * 0.30;
    }
  } else {
    float t0,t1;
    if (sphere(ro, rd, uR + uHmax*2.6, t0, t1)){
      vec3 p = ro + rd*max(t0,0.0);
      float g = clamp(dot(normalize(p), uSun), 0.0, 1.0);
      col += vec3(0.10,0.20,0.42)*pow(g,2.0)*0.20;
    }
  }

  col = col/(col + 0.72);                        // tonemap
  col = pow(max(col, 0.0), vec3(1.0/2.2));
  frag = vec4(col, 1.0);
}`;

/* ─────────────────── pass 2b: G2P — collect the granted share ───────────────────
   The droplet reads back the fraction the grid allowed at the cell it acted on
   and moves exactly that much into its load. The texel is looked up the same way
   the splat rasterised it, so what left the ground and what entered the droplets
   are the same number rather than two nearly-equal numbers.                     */
const FS_DROPB = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
uniform sampler2D uPos, uVel, uEro;
uniform sampler2DArray uF;
out vec4 oVel;

float grantAt(vec3 d){
  int f; vec2 s; dirToFace(normalize(d), f, s);
  ivec2 i = clamp(ivec2(floor(s*uN + 1.0)), ivec2(0), ivec2(int(uNT)-1));
  return texelFetch(uF, ivec3(i, f), 0).y;
}
void main(){
  ivec2 tc = ivec2(gl_FragCoord.xy);
  vec4 Pw = texelFetch(uPos, tc, 0);      // position the droplet acted FROM
  vec4 Vs = texelFetch(uVel, tc, 0);      // new heading, load not yet updated
  vec4 E  = texelFetch(uEro, tc, 0);      // (deposit, demand, water, retired)
  float sed = Vs.w;
  if (dot(Pw.xyz, Pw.xyz) > 0.5 && E.w < 0.5){
    sed = sed - E.x + E.y*grantAt(Pw.xyz);
  } else if (E.w > 0.5){
    sed = 0.0;                            // retired — the whole load was put down
  }
  oVel = vec4(Vs.xyz, max(sed, 0.0));
}`;

/* ─────────────────── droplet seed ─────────────────── */
const FS_DSEED = `#version 300 es
precision highp float; precision highp sampler2DArray;
${COMMON}
uniform float uSeed, uRain;
layout(location=0) out vec4 oPos;
layout(location=1) out vec4 oVel;
layout(location=2) out vec4 oEro;
void main(){
  float id = gl_FragCoord.y*4096.0 + gl_FragCoord.x;
  float a = hash11(id*1.13 + uSeed), b = hash11(id*7.71 + uSeed*3.7);
  float z = a*2.0-1.0, th = b*6.2831853, r = sqrt(max(0.0,1.0-z*z));
  oPos = vec4(r*cos(th), r*sin(th), z, uRain*hash11(id*2.3+uSeed));
  oVel = vec4(0.0);
  oEro = vec4(0.0);
}`;

/* ═══════════════════════════ programs ═══════════════════════════ */
const pMetric = prog(VS_QUAD, FS_METRIC);
const pUpl    = prog(VS_QUAD, FS_UPLIFT);
const pInit   = prog(VS_QUAD, FS_INIT);
const pStep   = prog(VS_QUAD, FS_STEP);
const pDrop   = prog(VS_QUAD, FS_DROP);
const pDropB  = prog(VS_QUAD, FS_DROPB);
const pSplat  = prog(VS_SPLAT, FS_SPLAT);
const pApply  = prog(VS_QUAD, FS_APPLY);
const pTalus  = prog(VS_QUAD, FS_TALUS);
const pRender = prog(VS_QUAD, FS_RENDER);
const pDSeed  = prog(VS_QUAD, FS_DSEED);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const fb  = gl.createFramebuffer();
const fb2 = gl.createFramebuffer();

/* ═══════════════════════════ resources ═══════════════════════════ */
let T = [], F = [], S = null, M = null, MA = null, Uf = null;   // field textures
let DP = [], DV = [], DE = null;                     // droplet textures
let cur = 0, NT = 0, AREF = 1, UMEAN = 0;
let frameNo = 0, simTime = 0;

function freeAll(){
  [...T, ...F, S, M, MA, Uf, ...DP, ...DV, DE].forEach(t => { if(t) gl.deleteTexture(t); });
  T=[]; F=[]; S=null; M=null; MA=null; Uf=null; DP=[]; DV=[]; DE=null;
}

function allocate(n, pd){
  freeAll();
  N = n; PD = pd; NT = N + 2;
  AREF = 4*Math.PI*R0*R0/(6*N*N);          // mean cell area — the splat's unit
  UPLIFT_SCALE = UPLIFT_BASE * (PD*PD)/(6*N*N);
  const f = LINEAR_OK ? gl.LINEAR : gl.NEAREST;
  T  = [tex2DArray(NT,NT,6, gl.RG32F,   gl.RG,   gl.FLOAT, f),
        tex2DArray(NT,NT,6, gl.RG32F,   gl.RG,   gl.FLOAT, f)];
  F  = [tex2DArray(NT,NT,6, gl.RG16F,   gl.RG,   gl.HALF_FLOAT, f),   // .x discharge, .y grant
        tex2DArray(NT,NT,6, gl.RG16F,   gl.RG,   gl.HALF_FLOAT, f)];
  // The splat accumulates per-droplet demands spanning many orders of magnitude.
  // In half-float the small tail lands in the sub-normal range and is flushed to
  // zero, so the grid sees no demand while the droplet still expects one. 32-bit
  // blending removes the tail problem outright; without EXT_float_blend we fall
  // back to 16F and eat a small, safe under-count instead.
  S  =  tex2DArray(NT,NT,6, SPLAT_F32 ? gl.RGBA32F : gl.RGBA16F, gl.RGBA,
                   SPLAT_F32 ? gl.FLOAT : gl.HALF_FLOAT, gl.NEAREST);
  M  =  tex2DArray(NT,NT,6, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST);
  MA =  tex2DArray(NT,NT,6, gl.R32F,    gl.RED,  gl.FLOAT, f);
  Uf =  tex2DArray(NT,NT,6, gl.R16F,    gl.RED,  gl.HALF_FLOAT, f);
  DP = [tex2D(PD,PD, gl.RGBA32F), tex2D(PD,PD, gl.RGBA32F)];
  DV = [tex2D(PD,PD, gl.RGBA32F), tex2D(PD,PD, gl.RGBA32F)];
  DE =  tex2D(PD,PD, gl.RGBA32F);
  const err = gl.getError();
  if (err !== gl.NO_ERROR) throw new Error('GL error '+err+' allocating '+n+'³-equivalent grid');
}

function tryAllocate(n, pd){
  const prevN = N, prevPD = PD;
  try { allocate(n, pd); return n; }
  catch(e){
    console.warn('allocation failed at', n, e);
    if (n > 128){ return tryAllocate(n>>1, pd); }
    allocate(prevN, prevPD); return prevN;
  }
}

/* ─────────────── common uniform block for every field pass ─────────────── */
function setGrid(p){
  gl.uniform1f(U(p,'uN'), N);
  gl.uniform1f(U(p,'uNT'), NT);
}
function drawQuad(){ gl.drawArrays(gl.TRIANGLES, 0, 3); }

function fieldPass(p, target, setup){
  gl.useProgram(p); setGrid(p);
  gl.viewport(0,0,NT,NT);
  for(let f=0; f<6; f++){
    bindLayer(fb, target, f);
    gl.uniform1i(U(p,'uFace'), f);
    if (setup) setup(f);
    drawQuad();
  }
}

/* ═══════════════════════════ build / reset ═══════════════════════════ */
function buildMetric(){
  gl.disable(gl.BLEND);
  gl.useProgram(pMetric); setGrid(pMetric);
  gl.uniform1f(U(pMetric,'uR'), R0);
  gl.viewport(0,0,NT,NT);
  for(let f=0; f<6; f++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, M,  0, f);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, MA, 0, f);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.uniform1i(U(pMetric,'uFace'), f);
    drawQuad();
  }
  gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, null, 0, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
}
function buildUplift(flat){
  gl.useProgram(pUpl); setGrid(pUpl);
  gl.uniform1f(U(pUpl,'uBelt'), P.belt);
  gl.uniform1f(U(pUpl,'uSharp'), P.sharp);
  gl.uniform1f(U(pUpl,'uSeed'), seed*0.0013);
  gl.uniform1i(U(pUpl,'uFlat'), flat ? 1 : 0);
  gl.viewport(0,0,NT,NT);
  for(let f=0; f<6; f++){ bindLayer(fb, Uf, f); gl.uniform1i(U(pUpl,'uFace'), f); drawQuad(); }

  // area-weighted mean, so the source term integrates to zero over the sphere
  const u = readAll(Uf), a = readAll(MA);
  let su = 0, sa = 0;
  for(let f=0; f<6; f++) for(let j=1; j<=N; j++) for(let i=1; i<=N; i++){
    const k = (j*NT+i)*4; su += u[f][k]*a[f][k]; sa += a[f][k];
  }
  UMEAN = su/sa;
}
function buildTerrain(){
  gl.useProgram(pInit); setGrid(pInit);
  gl.uniform1f(U(pInit,'uSeed'), seed*0.0031);
  gl.uniform1i(U(pInit,'uMode'), P.initMode);
  gl.viewport(0,0,NT,NT);
  for(const t of T) for(let f=0; f<6; f++){ bindLayer(fb, t, f); gl.uniform1i(U(pInit,'uFace'), f); drawQuad(); }
  for(const t of F) for(let f=0; f<6; f++){ bindLayer(fb, t, f); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); }
}
function seedDroplets(){
  gl.useProgram(pDSeed);
  gl.uniform1f(U(pDSeed,'uSeed'), seed*0.017);
  gl.uniform1f(U(pDSeed,'uRain'), P.rain);
  gl.viewport(0,0,PD,PD);
  for(let i=0;i<2;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb2);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, DP[i], 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, DV[i], 0);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, DE, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
    drawQuad();
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb2);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, null, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, null, 0);
}
function rebuild(n, pd){
  const got = tryAllocate(n, pd);
  if (got !== n) note('grid fell back to 6 × '+got+'²  (out of memory)', 'bad');
  gl.disable(gl.BLEND);
  buildMetric(); buildUplift(); buildTerrain(); seedDroplets();
  cur = 0; frameNo = 0; simTime = 0;
}

/* ═══════════════════════════ simulation step ═══════════════════════════ */
function substep(dt){
  gl.disable(gl.BLEND);
  gl.bindVertexArray(vao);

  // 1 — uplift + creep :  T[cur] → T[1-cur]
  gl.useProgram(pStep); setGrid(pStep);
  gl.uniform1i(U(pStep,'uT'), unit(0, T[cur]));
  gl.uniform1i(U(pStep,'uM'), unit(1, M));
  gl.uniform1i(U(pStep,'uU'), unit(2, Uf));
  gl.uniform1i(U(pStep,'uA'), unit(3, MA));
  gl.uniform1f(U(pStep,'uDt'), dt);
  gl.uniform1f(U(pStep,'uUplift'), P.uplift*UPLIFT_SCALE);
  gl.uniform1f(U(pStep,'uUMean'), UMEAN);
  gl.uniform1f(U(pStep,'uLith'), 0.02);
  gl.uniform1f(U(pStep,'uSedMax'), 0.0015);
  // the dx² normaliser lives in the coefficient, so 0…1 stays inside the
  // explicit-diffusion stability limit at every resolution
  gl.uniform1f(U(pStep,'uCreep'), P.creep*0.05*Math.pow(1.5708/N, 2));
  gl.viewport(0,0,NT,NT);
  for(let f=0; f<6; f++){ bindLayer(fb, T[1-cur], f); gl.uniform1i(U(pStep,'uFace'), f); drawQuad(); }
  cur = 1-cur;

  // 2 — droplets :  DP/DV[cur] → DP/DV[1-cur], deltas → DE
  gl.useProgram(pDrop); setGrid(pDrop);
  gl.uniform1i(U(pDrop,'uPos'), unit(0, DP[0], gl.TEXTURE_2D));
  gl.uniform1i(U(pDrop,'uVel'), unit(1, DV[0], gl.TEXTURE_2D));
  gl.uniform1i(U(pDrop,'uT'),   unit(2, T[cur]));
  gl.uniform1i(U(pDrop,'uA'),   unit(3, MA));
  gl.uniform1f(U(pDrop,'uAref'), AREF);
  gl.uniform1f(U(pDrop,'uCap'), CAP_K);
  gl.uniform1f(U(pDrop,'uDt'), dt);
  gl.uniform1f(U(pDrop,'uInertia'), P.inertia);
  gl.uniform1f(U(pDrop,'uErod'), P.erodibility);
  gl.uniform1f(U(pDrop,'uDepo'), P.deposition);
  gl.uniform1f(U(pDrop,'uHard'), P.hardness);
  gl.uniform1f(U(pDrop,'uEvap'), P.evaporation);
  gl.uniform1f(U(pDrop,'uRain'), P.rain);
  gl.uniform1f(U(pDrop,'uSea'), P.sea);
  gl.uniform1f(U(pDrop,'uFrame'), frameNo);
  gl.uniform1f(U(pDrop,'uSeed'), seed*0.011);
  gl.viewport(0,0,PD,PD);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb2);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, DP[1], 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, DV[1], 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, DE, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2]);
  drawQuad();
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, null, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT2, gl.TEXTURE_2D, null, 0);

  // 3 — splat the deltas (the droplet's OLD position is DP[0])
  gl.viewport(0,0,NT,NT);
  for(let f=0; f<6; f++){
    bindLayer(fb, S, f);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(pSplat); setGrid(pSplat);
  gl.uniform1i(U(pSplat,'uPos'), unit(0, DP[0], gl.TEXTURE_2D));
  gl.uniform1i(U(pSplat,'uEro'), unit(1, DE, gl.TEXTURE_2D));
  gl.uniform1f(U(pSplat,'uPD'), PD);
  gl.uniform1f(U(pSplat,'uGain'), SPLAT_GAIN);
  for(let f=0; f<6; f++){
    bindLayer(fb, S, f);
    gl.uniform1i(U(pSplat,'uFace'), f);
    gl.drawArrays(gl.POINTS, 0, PD*PD);
  }
  gl.disable(gl.BLEND);

  // 4 — apply :  T[cur] + S → T[1-cur],  F[0] → F[1]
  gl.useProgram(pApply); setGrid(pApply);
  gl.uniform1i(U(pApply,'uT'), unit(0, T[cur]));
  gl.uniform1i(U(pApply,'uS'), unit(1, S));
  gl.uniform1i(U(pApply,'uA'), unit(2, MA));
  gl.uniform1i(U(pApply,'uF'), unit(3, F[0]));
  gl.uniform1f(U(pApply,'uDt'), dt);
  gl.uniform1f(U(pApply,'uAref'), AREF);
  gl.uniform1f(U(pApply,'uHard'), P.hardness);
  gl.uniform1f(U(pApply,'uGain'), SPLAT_GAIN);
  gl.uniform1f(U(pApply,'uAllow'), ALLOW_K);
  gl.uniform1f(U(pApply,'uQScale'), (6*N*N)/(PD*PD));
  for(let f=0; f<6; f++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, T[1-cur], 0, f);
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, F[1], 0, f);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    gl.uniform1i(U(pApply,'uFace'), f);
    drawQuad();
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, null, 0, 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  cur = 1-cur;  F = [F[1], F[0]];

  // 2b — G2P: hand each droplet its granted share, then retire the old positions
  gl.useProgram(pDropB); setGrid(pDropB);
  gl.uniform1i(U(pDropB,'uPos'), unit(0, DP[0], gl.TEXTURE_2D));
  gl.uniform1i(U(pDropB,'uVel'), unit(1, DV[1], gl.TEXTURE_2D));
  gl.uniform1i(U(pDropB,'uEro'), unit(2, DE,    gl.TEXTURE_2D));
  gl.uniform1i(U(pDropB,'uF'),   unit(3, F[0]));
  gl.viewport(0,0,PD,PD);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb2);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, DV[0], 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  drawQuad();
  DP = [DP[1], DP[0]];              // positions advance; DV[0] is already current
  gl.viewport(0,0,NT,NT);

  // 5 — talus
  gl.useProgram(pTalus); setGrid(pTalus);
  gl.uniform1i(U(pTalus,'uT'), unit(0, T[cur]));
  gl.uniform1i(U(pTalus,'uM'), unit(1, M));
  gl.uniform1i(U(pTalus,'uA'), unit(2, MA));
  gl.uniform1f(U(pTalus,'uRepose'), P.repose);
  gl.uniform1f(U(pTalus,'uDt'), dt);
  for(let f=0; f<6; f++){ bindLayer(fb, T[1-cur], f); gl.uniform1i(U(pTalus,'uFace'), f); drawQuad(); }
  cur = 1-cur;

  frameNo++; simTime += dt;
}

/* ═══════════════════════════ camera ═══════════════════════════ */
const cam = { yaw:0.7, pitch:0.35, dist:2.9, tYaw:0.7, tPitch:0.35, tDist:2.9 };
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup',   e => { dragging = false; });
canvas.addEventListener('pointermove', e => {
  if(!dragging) return;
  cam.tYaw   -= (e.clientX - lastX)*0.006;
  cam.tPitch = Math.max(-1.45, Math.min(1.45, cam.tPitch + (e.clientY - lastY)*0.006));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.tDist = Math.max(1.06, Math.min(9.0, cam.tDist * Math.exp(e.deltaY*0.0011)));
}, {passive:false});

function norm(v){ const l = Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l, v[1]/l, v[2]/l]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

/* ═══════════════════════════ render ═══════════════════════════ */
let W = 1, H = 1;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.floor(canvas.clientWidth  * dpr * P.pixScale));
  H = Math.max(1, Math.floor(canvas.clientHeight * dpr * P.pixScale));
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);

function render(){
  cam.yaw   += (cam.tYaw   - cam.yaw)  *0.14;
  cam.pitch += (cam.tPitch - cam.pitch)*0.14;
  cam.dist  += (cam.tDist  - cam.dist) *0.12;

  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const eye = [Math.cos(cam.yaw)*cp*cam.dist, sp*cam.dist, Math.sin(cam.yaw)*cp*cam.dist];
  const fwd = norm([-eye[0], -eye[1], -eye[2]]);
  const right = norm(cross(fwd, [0,1,0]));
  const up = cross(right, fwd);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,W,H);
  gl.useProgram(pRender); setGrid(pRender);
  gl.uniform1i(U(pRender,'uT'), unit(0, T[cur]));
  gl.uniform1i(U(pRender,'uF'), unit(1, F[0]));
  gl.uniform1i(U(pRender,'uU'), unit(2, Uf));
  gl.uniform3f(U(pRender,'uEye'), eye[0], eye[1], eye[2]);
  gl.uniform3f(U(pRender,'uFwd'), fwd[0], fwd[1], fwd[2]);
  gl.uniform3f(U(pRender,'uRight'), right[0], right[1], right[2]);
  gl.uniform3f(U(pRender,'uUp'), up[0], up[1], up[2]);
  const sa = 0.9, sb = 0.55;
  gl.uniform3f(U(pRender,'uSun'), Math.cos(sa)*Math.cos(sb), Math.sin(sb), Math.sin(sa)*Math.cos(sb));
  gl.uniform2f(U(pRender,'uRes'), W, H);
  gl.uniform1f(U(pRender,'uTanFov'), Math.tan(0.42));
  gl.uniform1f(U(pRender,'uSteps'), P.steps);
  gl.uniform1f(U(pRender,'uSea'), P.sea);
  gl.uniform1f(U(pRender,'uR'), R0);
  gl.uniform1f(U(pRender,'uHmax'), HMAX);
  gl.uniform1i(U(pRender,'uShade'), P.shade);
  gl.uniform1i(U(pRender,'uWater'), P.water);
  gl.uniform1i(U(pRender,'uShadow'), P.shadow);
  drawQuad();
}

/* ═══════════════════════════ diagnostics ═══════════════════════════
   Readback is exact and slow, so it only runs on demand. Reading RGBA/FLOAT
   is the combination WebGL2 guarantees for float colour buffers.          */
function readLayer(tex, layer){
  const buf = new Float32Array(NT*NT*4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTextureLayer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, tex, 0, layer);
  gl.readBuffer(gl.COLOR_ATTACHMENT0);
  gl.readPixels(0,0,NT,NT, gl.RGBA, gl.FLOAT, buf);
  return buf;
}
function readAll(tex){ const a = []; for(let f=0;f<6;f++) a.push(readLayer(tex,f)); return a; }

const PI4 = Math.PI/4;
function faceToDirJS(face, s){
  const cx = Math.tan((s[0]*2-1)*PI4), cy = Math.tan((s[1]*2-1)*PI4);
  switch(face){
    case 0: return [ 1, cy, -cx];
    case 1: return [-1, cy,  cx];
    case 2: return [cx,  1, -cy];
    case 3: return [cx, -1,  cy];
    case 4: return [cx, cy,  1];
    default:return [-cx, cy, -1];
  }
}
function dirToFaceJS(d){
  const ax=Math.abs(d[0]), ay=Math.abs(d[1]), az=Math.abs(d[2]);
  let face, u, v;
  if(ax>=ay && ax>=az){ if(d[0]>0){face=0; u=-d[2]/ax; v=d[1]/ax;} else {face=1; u=d[2]/ax; v=d[1]/ax;} }
  else if(ay>=ax && ay>=az){ if(d[1]>0){face=2; u=d[0]/ay; v=-d[2]/ay;} else {face=3; u=d[0]/ay; v=d[2]/ay;} }
  else { if(d[2]>0){face=4; u=d[0]/az; v=d[1]/az;} else {face=5; u=-d[0]/az; v=d[1]/az;} }
  return [face, [Math.atan(u)/PI4*0.5+0.5, Math.atan(v)/PI4*0.5+0.5]];
}
// bilinear sample of a read-back field, using the halo exactly as the GPU does
function sampleJS(layers, d, ch){
  const [f, s] = dirToFaceJS(d);
  const px = (s[0]*N + 1.0) - 0.5, py = (s[1]*N + 1.0) - 0.5;
  const i0 = Math.max(0, Math.min(NT-2, Math.floor(px)));
  const j0 = Math.max(0, Math.min(NT-2, Math.floor(py)));
  const fx = px - i0, fy = py - j0;
  const L = layers[f];
  const at = (i,j) => L[(j*NT + i)*4 + ch];
  return (at(i0,j0)*(1-fx) + at(i0+1,j0)*fx)*(1-fy) + (at(i0,j0+1)*(1-fx) + at(i0+1,j0+1)*fx)*fy;
}

const diagEl = document.getElementById('diag');
function note(msg, cls){ diagEl.innerHTML = cls ? `<span class="${cls}">${msg}</span>` : msg; }

function totals(){
  const t = readAll(T[cur]), a = readAll(MA);
  let volRock = 0, volSed = 0, area = 0, absVol = 0;
  for(let f=0; f<6; f++){
    for(let j=1; j<=N; j++) for(let i=1; i<=N; i++){
      const k = (j*NT+i)*4;
      const A = a[f][k];
      volRock += t[f][k]*A; volSed += t[f][k+1]*A; area += A;
      // rock and sediment very nearly cancel, so |h|-weighted volume is the only
      // honest denominator for a drift percentage
      absVol += Math.abs(t[f][k] + t[f][k+1])*A;
    }
  }
  return {volRock, volSed, area, absVol};
}

let massRef = null;
// Σ of the volume the droplets are holding in transit — part of the ledger.
function dropletLoad(){
  const b = new Float32Array(PD*PD*4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb2);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, DV[0], 0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
  gl.readBuffer(gl.COLOR_ATTACHMENT0);
  gl.readPixels(0,0,PD,PD, gl.RGBA, gl.FLOAT, b);
  let s = 0; for(let i=3;i<b.length;i+=4) s += b[i];
  return s*AREF;
}

document.getElementById('tMass').onclick = () => {
  const s = totals();
  const sphereArea = 4*Math.PI*R0*R0;
  const areaErr = (s.area - sphereArea)/sphereArea;
  const inTransit = dropletLoad();
  const V = s.volRock + s.volSed + inTransit;
  let txt = `<b>mass audit</b>\n`;
  txt += `Σ area   ${s.area.toFixed(6)}\n`;
  txt += `4πR²     ${sphereArea.toFixed(6)}   (${(areaErr*100).toFixed(4)} %)\n`;
  txt += `V rock   ${s.volRock.toExponential(5)}\n`;
  txt += `V sed    ${s.volSed.toExponential(5)}\n`;
  txt += `in flight${inTransit.toExponential(5)}\n`;
  if (massRef){
    // uplift is mean-zero, so the closed sphere's total volume is invariant
    const dv = V - massRef.v;
    const steps = frameNo - massRef.f;
    const rel = dv/Math.max(massRef.abs, 1e-30);
    txt += `\nover ${steps} steps\n`;
    txt += `ΔV       ${dv.toExponential(4)}\n`;
    txt += `Σ|h|dA   ${massRef.abs.toExponential(4)}\n`;
    txt += (Math.abs(rel) < 0.005
      ? `<span class="ok">drift ${(rel*100).toFixed(3)} % — conserved</span>`
      : `<span class="bad">drift ${(rel*100).toFixed(3)} %</span>`);
  } else {
    txt += `\nbaseline set — run, then press again`;
  }
  massRef = { v: V, f: frameNo, abs: s.absVol };
  note(txt);
};

document.getElementById('tFlat').onclick = () => {
  // uniform shell + uniform uplift + no droplets: any six-fold pattern is a metric bug
  const keep = { init:P.initMode, rain:P.rain };
  P.initMode = 1; P.rain = 0;
  buildUplift(true);                      // uniform source term
  UMEAN = 0;                              // ...and don't subtract it, or the test drives nothing
  buildTerrain(); seedDroplets();
  gl.disable(gl.BLEND);
  const K = 240;
  for(let i=0;i<K;i++) substep(1.0);
  const t = readAll(T[cur]);
  let mn = 1e9, mx = -1e9, sum = 0, n = 0;
  for(let f=0; f<6; f++) for(let j=1; j<=N; j++) for(let i=1; i<=N; i++){
    const h = t[f][(j*NT+i)*4] + t[f][(j*NT+i)*4+1];
    mn = Math.min(mn,h); mx = Math.max(mx,h); sum += h; n++;
  }
  const mean = sum/n, spread = (mx-mn)/Math.abs(mean);
  const ok = spread < 1e-4;
  note(`<b>flat test</b>  ${K} steps\n`
     + `mean h   ${mean.toExponential(6)}\n`
     + `spread   ${(spread*100).toExponential(3)} %  of mean\n`
     + (ok ? `<span class="ok">uniform — no face pattern</span>`
           : `<span class="bad">NON-UNIFORM — metric bug</span>`));
  P.initMode = keep.init; P.rain = keep.rain;
  buildUplift(false);
};

document.getElementById('tIso').onclick = () => {
  /* Identical Gaussian bumps at a cube CORNER and at a face CENTRE, spread by
     hillslope creep alone. Droplets are off on purpose: a drainage network is
     azimuthally structured by nature, so eroding the bumps would measure the
     stochasticity of rivers rather than the geometry of the grid. Under pure
     diffusion the bump must stay axisymmetric, and the corner must behave
     exactly like the face centre — which is only true if the metric weights,
     the halo and the corner ghost cells are all right. */
  const keep = { init:P.initMode, rain:P.rain, creep:P.creep, up:P.uplift };
  P.initMode = 2; P.rain = 0; P.creep = 1.0; P.uplift = 0;
  buildTerrain(); seedDroplets();
  gl.disable(gl.BLEND);
  const K = 400;
  for(let i=0;i<K;i++) substep(1.0);
  const t = readAll(T[cur]);
  const corner = norm([1,1,1]), centre = [1,0,0];
  const BASE = 0.004;

  function ring(c, rho){
    const e1 = norm(cross(c, Math.abs(c[2])<0.9 ? [0,0,1] : [1,0,0]));
    const e2 = cross(c, e1);
    const M0 = 720; let sum = 0, sum2 = 0;
    for(let i=0;i<M0;i++){
      const a = i/M0*2*Math.PI, cr = Math.cos(rho), sr = Math.sin(rho);
      const d = norm([ c[0]*cr + (e1[0]*Math.cos(a)+e2[0]*Math.sin(a))*sr,
                       c[1]*cr + (e1[1]*Math.cos(a)+e2[1]*Math.sin(a))*sr,
                       c[2]*cr + (e1[2]*Math.cos(a)+e2[2]*Math.sin(a))*sr ]);
      const h = sampleJS(t, d, 0) + sampleJS(t, d, 1) - BASE;
      sum += h; sum2 += h*h;
    }
    const m = sum/M0;
    return { mean: m, sd: Math.sqrt(Math.max(sum2/M0 - m*m, 0)) };
  }
  const ampC = sampleJS(t, corner, 0) + sampleJS(t, corner, 1) - BASE;
  const ampF = sampleJS(t, centre, 0) + sampleJS(t, centre, 1) - BASE;
  const amp  = 0.5*(ampC + ampF);

  let txt = `<b>isotropy test</b>  ${K} steps, creep only\n`;
  txt += `peak  corner ${ampC.toExponential(3)}\n`;
  txt += `      face   ${ampF.toExponential(3)}   Δ ${(Math.abs(ampC-ampF)/amp*100).toFixed(2)} %\n`;
  let worst = 0;
  for(const rho of [0.06, 0.12, 0.20]){
    const a = ring(corner, rho), b = ring(centre, rho);
    const dm = Math.abs(a.mean-b.mean)/amp, sa = a.sd/amp, sb = b.sd/amp;
    worst = Math.max(worst, dm, sa, sb);
    txt += `ρ=${rho.toFixed(2)}  Δmean ${(dm*100).toFixed(2)} %`
        +  `  σ ${(sa*100).toFixed(2)}/${(sb*100).toFixed(2)} %\n`;
  }
  txt += (worst < 0.02)
       ? `<span class="ok">isotropic — corner ≡ face centre</span>`
       : `<span class="bad">anisotropy ${(worst*100).toFixed(1)} % of peak</span>`;
  note(txt);
  P.initMode = keep.init; P.rain = keep.rain; P.creep = keep.creep; P.uplift = keep.up;
};

/* ═══════════════════════════ UI ═══════════════════════════ */
const $ = id => document.getElementById(id);
function slider(id, vid, key, scale, fmt){
  const el = $(id), lab = $(vid);
  const apply = () => {
    P[key] = parseFloat(el.value)*(scale||1);
    lab.textContent = fmt ? fmt(P[key]) : P[key].toFixed(2);
  };
  el.oninput = apply; apply();
}
slider('up','vUp','uplift');
slider('belt','vBelt','belt');
slider('sharp','vSharp','sharp');
slider('rain','vRain','rain');
slider('ero','vEro','erodibility');
slider('dep','vDep','deposition');
slider('hard','vHard','hardness');
slider('iner','vIner','inertia');
slider('evap','vEvap','evaporation',1,v=>v.toFixed(3));
slider('diff','vDiff','creep');
slider('rep','vRep','repose');
slider('sea','vSea','sea',1,v=>v.toFixed(4));
slider('spd','vSpd','dt');

$('belt').addEventListener('change', () => buildUplift(false));
$('sharp').addEventListener('change', () => buildUplift(false));

$('shade').onchange = e => P.shade = parseInt(e.target.value);
$('water').onchange = e => P.water = e.target.checked ? 1 : 0;
$('shadow').onchange = e => P.shadow = e.target.checked ? 1 : 0;
$('spin').onchange = e => P.spin = e.target.checked ? 1 : 0;
$('init').onchange = e => { P.initMode = parseInt(e.target.value); buildTerrain(); seedDroplets(); };
$('grid').onchange  = e => rebuild(parseInt(e.target.value), PD);
$('drops').onchange = e => rebuild(N, parseInt(e.target.value));
$('quality').onchange = e => {
  const q = { low:[180,0.6], med:[300,0.85], high:[460,1.0], ultra:[700,1.0] }[e.target.value];
  P.steps = q[0]; P.pixScale = q[1]; resize();
};
let paused = false;
$('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Run' : 'Pause'; };
$('reset').onclick = () => { seed = (Math.random()*1e6)|0; buildUplift(); buildTerrain(); seedDroplets();
                             frameNo = 0; simTime = 0; massRef = null; note('idle'); };

/* ═══════════════════════════ main loop ═══════════════════════════ */
const hud = $('hud');
let fpsT = performance.now(), fpsN = 0, fps = 0;

function frame(){
  if (P.spin && !dragging) cam.tYaw += 0.0012;
  if (!paused && P.dt > 0){
    substep(P.dt);
  }
  render();

  fpsN++;
  const now = performance.now();
  if (now - fpsT > 500){ fps = fpsN*1000/(now-fpsT); fpsN = 0; fpsT = now; }
  hud.innerHTML = `${fps.toFixed(0)} fps · 6 × ${N}²<br>${(PD*PD/1000).toFixed(0)} k droplets · step ${frameNo}`;
  requestAnimationFrame(frame);
}

resize();
rebuild(N, PD);
note('idle');
frame();
</script>
