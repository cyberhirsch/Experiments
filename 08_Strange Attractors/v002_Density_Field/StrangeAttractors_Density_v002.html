<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Strange Attractors - Density Field</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#070809;color:#e6ecf2;font:12px JetBrains Mono,Consolas,monospace}
body{display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(ellipse at 50% 45%,rgba(134,184,217,.11),transparent 52%),#070809}
header,footer{padding:18px 28px;border-color:rgba(230,236,242,.12);z-index:2}header{border-bottom:1px solid rgba(230,236,242,.12);display:flex;justify-content:space-between;align-items:baseline}footer{border-top:1px solid rgba(230,236,242,.12);display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
h1{font:italic 28px Cormorant Garamond,Georgia,serif;font-weight:300;margin:0}.meta,.dim{color:#5a6470}.hot{color:#86b8d9}
main{position:relative}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.read{position:absolute;right:28px;top:20px;text-align:right;color:#5a6470;line-height:1.8;text-transform:uppercase}.read b{color:#86b8d9;font-weight:400}.left{position:absolute;left:28px;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;color:#5a6470;text-transform:uppercase}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap}input{width:118px;accent-color:#86b8d9}label{color:#5a6470}button{background:transparent;border:1px solid rgba(230,236,242,.14);color:#5a6470;padding:7px 12px;text-transform:uppercase;cursor:pointer}button.active,button:hover{color:#86b8d9;border-color:#86b8d9}
</style>
</head>
<body>
<header><h1>No. 08 - Density Field</h1><div class="meta">statistical occupancy map / millions of projected samples / <span class="hot">log exposure</span></div></header>
<main><canvas id="stage"></canvas><div class="left" id="status">DENSITY ACTIVE</div><div class="read">samples <b id="samples">0</b><br>peak <b id="peak">0</b><br>system <b id="sys">Lorenz</b><br>fps <b id="fps">0</b></div></main>
<footer><div class="dim">Long-exposure chaos map accumulated from parallel particle states</div><div class="controls"><label>Batch <input id="batch" type="range" min="2000" max="24000" step="1000" value="9000"></label><label>Fade <input id="fade" type="range" min="0.985" max="1" step="0.001" value="0.996"></label><button id="system">Thomas</button><button id="run" class="active">Run</button><button id="reset">Reset</button></div></footer>
<script>
const W=720,H=520,N=9000,canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),dens=new Float32Array(W*H),img=ctx.createImageData(W,H),pts=[];let system='lorenz',running=true,samples=0,peak=1,last=performance.now(),frames=0,acc=0,yaw=.2;
const $=id=>document.getElementById(id);
function r(i){return (Math.sin(i*12.9898+i*i*.078)*43758.5453)%1}
function seed(){pts.length=0;for(let i=0;i<N;i++)pts.push({x:(r(i+1)-.5)*.2,y:(r(i+2)-.5)*.2,z:system==='lorenz'?22+(r(i+3)-.5)*.2:(r(i+3)-.5)*2});dens.fill(0);samples=0;peak=1}
function f(p){if(system==='lorenz'){return[10*(p.y-p.x),p.x*(28-p.z)-p.y,p.x*p.y-8/3*p.z]}const b=.208;return[Math.sin(p.y)-b*p.x,Math.sin(p.z)-b*p.y,Math.sin(p.x)-b*p.z]}
function step(p,dt){const a=f(p),b=f({x:p.x+a[0]*dt/2,y:p.y+a[1]*dt/2,z:p.z+a[2]*dt/2}),c=f({x:p.x+b[0]*dt/2,y:p.y+b[1]*dt/2,z:p.z+b[2]*dt/2}),d=f({x:p.x+c[0]*dt,y:p.y+c[1]*dt,z:p.z+c[2]*dt});p.x+=(a[0]+2*b[0]+2*c[0]+d[0])*dt/6;p.y+=(a[1]+2*b[1]+2*c[1]+d[1])*dt/6;p.z+=(a[2]+2*b[2]+2*c[2]+d[2])*dt/6}
function tick(){const batch=+$('batch').value,fade=+$('fade').value;for(let i=0;i<dens.length;i++)dens[i]*=fade;peak*=fade;const scale=system==='lorenz'?9:85,dt=system==='lorenz'?.006:.035;for(let k=0;k<batch;k++){const p=pts[k%pts.length];step(p,dt);const cy=Math.cos(yaw),sy=Math.sin(yaw),x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,px=(x/scale+.5)*W,py=(p.y/scale+.5)*H|0,ix=px|0;if(ix>=0&&py>=0&&ix<W&&py<H){const id=py*W+ix;dens[id]+=1;peak=Math.max(peak,dens[id]);samples++}}yaw+=.001}
function draw(){let o=0;for(let i=0;i<dens.length;i++){const v=Math.log1p(dens[i])*42,heat=Math.min(1,dens[i]/(peak||1));img.data[o++]=Math.min(255,v*(.7+heat));img.data[o++]=Math.min(255,v*1.25);img.data[o++]=Math.min(255,v*1.7+heat*80);img.data[o++]=255}ctx.putImageData(img,0,0);ctx.drawImage(canvas,0,0,W,H,0,0,canvas.width,canvas.height)}
function resize(){const d=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth*d,h=canvas.clientHeight*d;if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}}
function frame(t){resize();if(running)tick();draw();frames++;acc+=(t-last)/1000;last=t;if(acc>.5){$('fps').textContent=Math.round(frames/acc);$('samples').textContent=samples.toLocaleString('en-US');$('peak').textContent=Math.round(peak);frames=0;acc=0}requestAnimationFrame(frame)}
$('system').onclick=()=>{system=system==='lorenz'?'thomas':'lorenz';$('system').textContent=system==='lorenz'?'Thomas':'Lorenz';$('sys').textContent=system==='lorenz'?'Lorenz':'Thomas';seed()};$('run').onclick=()=>{running=!running;$('run').classList.toggle('active',running);$('status').textContent=running?'DENSITY ACTIVE':'DENSITY PAUSED'};$('reset').onclick=seed;
seed();requestAnimationFrame(frame);
</script>
</body>
</html>
